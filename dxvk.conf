# --- DXVK Performance & Quality config ---

# Async pipeline compilation - prevents stutter/freeze on first shader use
# PRIMARY FIX for "FPS starts low then increases" issue
dxvk.enableAsync = True

dxvk.hud = 0
dxgi.nvapiHack = False

# Pipeline state cache - persist compiled pipelines across sessions
dxvk.enableStateCacheByDefault = True

# Depth precision fix
d3d9.floatEmulation = strict
d3d9.depthBiasClamp = true
d3d9.allowD32WithoutStencil = true
d3d9.depthClipEnable = false

# Prevent buffer misuse
d3d9.evictManagedOnUnlock = true
d3d9.forceSamplerTypeSpecConstants = false
d3d9.deferSurfaceCreation = true

# Shader consistency
d3d9.strictPow = false
d3d9.forceAspectRatio = 1

# Quality: Use highest anisotropic filtering for sharper textures
d3d9.samplerAnisotropy = 16

# Frame pipelining: Allow 2 frames in-flight for better CPU/GPU parallelism.
# maxFrameLatency=1 forces CPU to wait for GPU each frame, causing stalls in
# crowded scenes. Value of 2 allows the CPU to prepare the next frame while
# GPU renders the current one, significantly reducing FPS drops.
d3d9.maxFrameLatency = 2

# Disable VSync to uncap FPS (removes 60fps cap from VK_PRESENT_MODE_FIFO).
# Comment this line to re-enable VSync if screen tearing is unacceptable.
d3d9.presentInterval = 0

# Allow DXVK to batch more draw calls before flushing to the GPU.
# Reduces driver overhead in scenes with many small draw calls (effects, particles).
d3d9.maxAvailableMemory = 4096
